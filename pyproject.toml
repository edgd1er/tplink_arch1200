[project]
name = 'archer1200'
version = '1.0'
description = 'API for TP Link archer1200'
authors = [
  { name = "Edgd1er", email = "edgd1er@hotmail.com" },
]
requires-python = ">=3.9"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
readme="README.md"
dependencies = [
  "certifi >= 2026.10.19",
  "charset-normalizer >= 3.5.2",
  "coverage >= 6.5.0",
  "requests >= 2.32.5",
  "urllib3 >= 2.8.0",
  "dnspython >= 2.9.0",
]
[project.optional-dependencies]
test = [
  "pytest == 9.2.0",
]
lint = [
  "ruff >= 0.15.2",
  "mypy >= 1.19.1",
  "flake8 >= 7.2.0"
]
dev = [
  "archer1200[test,lint]",
]

[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
indent-width = 4

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = [
  "F", # pyflakes
  "E", # pycodestyle
  "I", # isort
  "ANN", # flake8 type annotations
  "RUF", # ruff-specific rules
]
fixable = ["ALL"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
disallow_untyped_defs = true

[flake8]
ignore = "E501"
exclude = ".git,__pycache__,docs/source/conf.py,old,build,dist,tp"
max-complexity = "10"