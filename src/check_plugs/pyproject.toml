[project]
name = "check_plugs"
version = "1.0"
description = "Check Meross wifi plug status and control them based on host availability"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  { name = "Edgd1er", email = "edgd1er@hotmail.com" },
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Home Automation",
  "Topic :: System :: Monitoring",
  "Topic :: Utilities",
]
dependencies = [
  "aiohttp >= 3.14.0",
  "meross_iot >= 0.4.0",
  "requests >= 2.32.5",
]

[project.scripts]
check_plugs = "check_plugs:main"

[project.optional-dependencies]
test = [
  "pytest == 9.0.3",
]
lint = [
  "ruff >= 0.15.2",
  "mypy >= 1.19.1",
  "flake8 >= 7.2.0",
]
dev = [
  "check_plugs[test,lint]",
]

[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
indent-width = 4

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = [
  "F",
  "E",
  "I",
  "ANN",
  "RUF",
]
fixable = ["ALL"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
disallow_untyped_defs = true

[tool.flake8]
ignore = "E501"
exclude = ".git,__pycache__,docs/source/conf.py,old,build,dist"
max-complexity = 10
